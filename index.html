<!DOCTYPE html>

<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Summer Update Countdown</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

/* ==============================
   CONTAINER
============================== */

#app {
    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
}

/* ==============================
   COUNTDOWN
============================== */

.countdown {
    position: relative;

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 15px 18px 20px;

    background: rgba(255, 255, 255, 0.96);

    border-radius: 14px;

    box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.18);

    border: 2px solid rgba(0, 0, 0, 0.08);
}

/* ==============================
   TITLE
============================== */

.title {
    position: absolute;

    top: -28px;
    left: 50%;

    transform: translateX(-50%);

    padding: 5px 13px;

    background: #ffffff;

    border-radius: 7px;

    font-size: 12px;
    font-weight: 900;

    letter-spacing: 2px;

    color: #111111;

    white-space: nowrap;

    box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.12);
}

/* Summer accent */

.title::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 3px;

    border-radius: 10px;

    background: linear-gradient(
        90deg,
        #ffd23f,
        #ffb000,
        #ff8a00
    );
}

/* ==============================
   TIME BLOCK
============================== */

.time-box {
    width: 115px;
    height: 100px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    position: relative;

    background: #ffffff;

    border-radius: 10px;

    border: 2px solid #e7e7e7;

    box-shadow:
        inset 0 -3px 0 rgba(0, 0, 0, 0.04);

    overflow: hidden;
}

/* Subtle summer stripe */

.time-box::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 4px;

    background: linear-gradient(
        90deg,
        #ffd23f,
        #ffb000
    );
}

/* ==============================
   NUMBERS
============================== */

.number {
    font-size: 52px;

    line-height: 1;

    font-weight: 900;

    color: #111111;

    font-variant-numeric: tabular-nums;

    letter-spacing: -2px;

    transition:
        transform 0.15s ease,
        color 0.2s ease;
}

/* ==============================
   LABEL
============================== */

.label {
    margin-top: 7px;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 2px;

    color: #777777;
}

/* ==============================
   SEPARATORS
============================== */

.separator {
    font-size: 38px;

    font-weight: 900;

    color: #222222;

    margin-top: -8px;
}

/* ==============================
   SMALL POP
============================== */

.pop {
    transform: scale(1.06);
}

/* ==============================
   PROGRESS BAR
============================== */

.progress {
    position: absolute;

    bottom: 7px;

    left: 18px;
    right: 18px;

    height: 4px;

    background: #eeeeee;

    border-radius: 10px;

    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;

    border-radius: 10px;

    background: linear-gradient(
        90deg,
        #ffd23f,
        #ffb000,
        #ff8a00
    );

    transition: width 0.5s linear;
}

/* ==============================
   AFTER 22:00
============================== */

.finished .countdown {
    border-color: rgba(220, 40, 40, 0.25);
}

.finished .title {
    color: #c92828;
}

.finished .title::after {
    background: #d83232;
}

.finished .time-box::before {
    background: #d83232;
}

.finished .number {
    color: #d83232;
}

.finished .label {
    color: #a75a5a;
}

.finished .separator {
    color: #d83232;
}

.finished .progress-fill {
    background: #d83232;
}

/* ==============================
   SMALL SCREENS
============================== */

@media (max-width: 700px) {

    .countdown {
        gap: 5px;

        padding:
            12px
            10px
            18px;
    }

    .time-box {
        width: 72px;
        height: 72px;
    }

    .number {
        font-size: 34px;
    }

    .label {
        font-size: 7px;
        letter-spacing: 1px;
    }

    .separator {
        font-size: 24px;
    }

    .title {
        font-size: 9px;
        top: -23px;
    }

    .progress {
        left: 10px;
        right: 10px;
    }
}
</style>

</head>

<body>

<div id="app">

<div class="countdown" id="countdown">

    <div class="title" id="title">
        SUMMER UPDATE
    </div>

    <!-- DAYS -->
    <div class="time-box">

        <div
            class="number"
            id="days">
            00
        </div>

        <div class="label">
            DAYS
        </div>

    </div>


    <div class="separator">
        :
    </div>


    <!-- HOURS -->
    <div class="time-box">

        <div
            class="number"
            id="hours">
            00
        </div>

        <div class="label">
            HOURS
        </div>

    </div>


    <div class="separator">
        :
    </div>


    <!-- MINUTES -->
    <div class="time-box">

        <div
            class="number"
            id="minutes">
            00
        </div>

        <div class="label">
            MINUTES
        </div>

    </div>


    <div class="separator">
        :
    </div>


    <!-- SECONDS -->
    <div class="time-box">

        <div
            class="number"
            id="seconds">
            00
        </div>

        <div class="label">
            SECONDS
        </div>

    </div>


    <!-- PROGRESS -->
    <div class="progress">

        <div
            class="progress-fill"
            id="progress">
        </div>

    </div>

</div>

</div>

<script>

/* =========================================
   SUMMER UPDATE COUNTDOWN
   Target: vandaag om 22:00
========================================= */


/* Tijd instellen */

const TARGET_HOUR = 22;
const TARGET_MINUTE = 00;
const TARGET_SECOND = 0;


/* Elementen */

const countdown =
    document.getElementById("countdown");

const title =
    document.getElementById("title");

const days =
    document.getElementById("days");

const hours =
    document.getElementById("hours");

const minutes =
    document.getElementById("minutes");

const seconds =
    document.getElementById("seconds");

const progress =
    document.getElementById("progress");


/* =========================================
   VANDAAG 00:00
========================================= */

function getStartTime() {

    const start = new Date();

    start.setHours(
        0,
        0,
        0,
        0
    );

    return start;
}


/* =========================================
   VANDAAG 22:00
========================================= */

function getTargetTime() {

    const target = new Date();

    target.setHours(
        TARGET_HOUR,
        TARGET_MINUTE,
        TARGET_SECOND,
        0
    );

    return target;
}


/* =========================================
   NUMMERS ALTIJD 2 CIJFERS
========================================= */

function pad(number) {

    return String(number)
        .padStart(2, "0");

}


/* =========================================
   KLEINE ANIMATIE BIJ NIEUWE SECONDE
========================================= */

function pop(element) {

    element.classList.remove("pop");

    void element.offsetWidth;

    element.classList.add("pop");

}


/* =========================================
   COUNTDOWN
========================================= */

let previousSecond = -1;


function updateCountdown() {

    const now = new Date();

    const target =
        getTargetTime();

    let difference =
        target.getTime()
        -
        now.getTime();


    /* =====================================
       VOOR 22:00
    ===================================== */

    if (difference > 0) {

        countdown.classList.remove(
            "finished"
        );

        title.textContent =
            "SUMMER UPDATE";


        let totalSeconds =
            Math.floor(
                difference / 1000
            );


        const d =
            Math.floor(
                totalSeconds / 86400
            );


        totalSeconds =
            totalSeconds % 86400;


        const h =
            Math.floor(
                totalSeconds / 3600
            );


        totalSeconds =
            totalSeconds % 3600;


        const m =
            Math.floor(
                totalSeconds / 60
            );


        const s =
            totalSeconds % 60;


        days.textContent =
            pad(d);

        hours.textContent =
            pad(h);

        minutes.textContent =
            pad(m);

        seconds.textContent =
            pad(s);


        /* Progress bar */

        const start =
            getStartTime();

        const total =
            target.getTime()
            -
            start.getTime();

        const elapsed =
            now.getTime()
            -
            start.getTime();


        let percent =
            (elapsed / total) * 100;


        percent =
            Math.max(
                0,
                Math.min(
                    100,
                    percent
                )
            );


        progress.style.width =
            percent + "%";


        /* Kleine seconde-animatie */

        if (s !== previousSecond) {

            pop(seconds);

            previousSecond = s;

        }

    }


    /* =====================================
       NA 22:00
    ===================================== */

    else {

        countdown.classList.add(
            "finished"
        );

        title.textContent =
            "SUMMER UPDATE IS LIVE";


        difference =
            Math.abs(difference);


        let totalSeconds =
            Math.floor(
                difference / 1000
            );


        const d =
            Math.floor(
                totalSeconds / 86400
            );


        totalSeconds =
            totalSeconds % 86400;


        const h =
            Math.floor(
                totalSeconds / 3600
            );


        totalSeconds =
            totalSeconds % 3600;


        const m =
            Math.floor(
                totalSeconds / 60
            );


        const s =
            totalSeconds % 60;


        days.textContent =
            "+" + pad(d);

        hours.textContent =
            pad(h);

        minutes.textContent =
            pad(m);

        seconds.textContent =
            pad(s);


        progress.style.width =
            "100%";


        if (s !== previousSecond) {

            pop(seconds);

            previousSecond = s;

        }

    }

}


/* =========================================
   START
========================================= */

updateCountdown();


setInterval(
    updateCountdown,
    250
);

</script>

</body>
</html>
